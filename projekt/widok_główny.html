<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Widok główny - Projekt</title>
    <link rel="stylesheet"  href="css/styl_widoko_głównego.css">
    <meta name="description" content="Tu będzie opis">
</head>
<body>
    <header>
        <div class="naglowek">
            <h1>Widok główny</h1>
        </div>
    </header>
    <main>
    <div class="kanban">
        <div class="kanban_col" id="do_zrob">
            <h2>Do zrobienia</h2><hr>
            <div class="add_task">
                <input type="text" id="task_input" class="task_input"
                           placeholder="Wpisz zadanie...">
                <button class ="add_task_button">
                        Dodaj zadanie
                </button>
            </div>
            <div class="list_task">
                <div class="task_box">Zadanie 1</div>
                <div class="task_box">Zadanie 2</div>
                <div class="task_box">Zadanie 3</div>
            </div>
        </div>
        <div class="kanban_col" id="w_trakcie">
            <h2>W trakcie</h2><hr>
            <div class="list_task">
                <div class="task_box">Zadanie 1</div>
                <div class="task_box">Zadanie 2</div>
                <div class="task_box">Zadanie 3</div>
                <div class="task_box">Zadanie 4</div>
            </div>
        </div>
        <div class="kanban_col" id="zrobione">
            <h2>Zrobione</h2><hr>
            <div class="list_task">
                <div class="task_box">Zadanie 1</div>
            </div>
        </div>
    </div>
    </main>

    <footer id="stopka" class="stopka"> Projekt • Natalia W. </footer>
</body>

</html>
